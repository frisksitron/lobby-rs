<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>{{name}}</title>
<style>
:root {
  --bg: #1f1a17;
  --card: #2b2420;
  --field: #1f1a17;
  --border: #3a302a;
  --text: #f1e8dd;
  --muted: #a39486;
  --accent: #c4a6f5;
  --accent-hover: #cfb6f7;
  --accent-active: #b596ec;
  --on-accent: #231a31;
  --quiet: #362e29;
  --quiet-hover: #43392f;
  --quiet-active: #4d4239;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: 16px;
  color: var(--text);
  background:
    radial-gradient(60rem 40rem at 50% -10%, #c4a6f526, transparent 70%),
    var(--bg);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
}
main {
  width: 100%;
  max-width: 26rem;
  padding: 2.25rem 1.5rem 1.5rem;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: 0 1.5rem 3rem -1rem #0c080699;
  text-align: center;
}
.mark {
  width: 4rem;
  height: 4rem;
  margin: 0 auto 1.25rem;
  display: grid;
  place-items: center;
  border-radius: 1.25rem;
  background: #3a2d4c;
  border: 1px solid #4a3a60;
  color: var(--accent);
  font-size: 1.75rem;
  font-weight: 700;
  text-transform: uppercase;
}
h1 {
  margin: 0;
  font-size: 1.75rem;
  line-height: 1.2;
  font-weight: 700;
  letter-spacing: -0.01em;
  overflow-wrap: anywhere;
}
.tagline { margin: 0.5rem 0 1.75rem; color: var(--muted); }
.actions { display: grid; gap: 0.625rem; }
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 2.75rem;
  padding: 0 1rem;
  border: 0;
  border-radius: 10px;
  font: inherit;
  font-weight: 600;
  color: var(--text);
  background: var(--quiet);
  text-decoration: none;
  cursor: pointer;
  transition: background-color 0.12s;
}
.btn:hover { background: var(--quiet-hover); }
.btn:active { background: var(--quiet-active); }
.btn.primary { color: var(--on-accent); background: var(--accent); }
.btn.primary:hover { background: var(--accent-hover); }
.btn.primary:active { background: var(--accent-active); }
.btn:focus-visible, .copy:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.address {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-top: 1.5rem;
  padding: 0.375rem 0.375rem 0.375rem 0.875rem;
  background: var(--field);
  border: 1px solid var(--border);
  border-radius: 10px;
  text-align: left;
}
.address code {
  flex: 1;
  min-width: 0;
  font: 0.9375rem/1.3 ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;
  overflow-wrap: anywhere;
  user-select: all;
}
.copy {
  flex: none;
  min-width: 4.5rem;
  min-height: 2rem;
  padding: 0 0.75rem;
  border: 0;
  border-radius: 8px;
  font: inherit;
  font-size: 0.875rem;
  font-weight: 600;
  color: var(--text);
  background: var(--quiet);
  cursor: pointer;
  transition: background-color 0.12s;
}
.copy:hover { background: var(--quiet-hover); }
.copy:active { background: var(--quiet-active); }
.hint { margin: 1rem 0 0; font-size: 0.8125rem; color: var(--muted); }
@media (prefers-reduced-motion: reduce) {
  .btn, .copy { transition: none; }
}
</style>
</head>
<body>
<main>
  <div class="mark" id="mark" aria-hidden="true"></div>
  <h1 id="name">{{name}}</h1>
  <p class="tagline">A private Lobby for a group of friends.</p>
  <div class="actions">
    <a class="btn primary" id="open" href="lobby://">Open in Lobby</a>
    <a class="btn" href="{{download}}">Download for Windows</a>
  </div>
  <div class="address">
    <code id="address"></code>
    <button class="copy" id="copy" type="button">Copy</button>
  </div>
  <p class="hint">If Open does nothing, install Lobby first, then press Open again.</p>
</main>
<script>
(function () {
  var host = location.host;
  var address = document.getElementById("address");
  var copy = document.getElementById("copy");
  var first = Array.from(document.getElementById("name").textContent.trim())[0];
  document.getElementById("mark").textContent = first || "";
  document.getElementById("open").href = "lobby://" + host;
  address.textContent = host;

  function select() {
    var range = document.createRange();
    range.selectNodeContents(address);
    var selection = getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
  }

  function copyWithSelection() {
    select();
    try {
      return document.execCommand("copy");
    } catch (e) {
      return false;
    }
  }

  var timer;
  function say(text) {
    copy.textContent = text;
    clearTimeout(timer);
    timer = setTimeout(function () { copy.textContent = "Copy"; }, 2000);
  }

  copy.addEventListener("click", function () {
    function fallback() {
      say(copyWithSelection() ? "Copied" : "Ctrl+C");
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(host).then(function () { say("Copied"); }, fallback);
    } else {
      fallback();
    }
  });
})();
</script>
</body>
</html>
