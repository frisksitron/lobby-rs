name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml pins the channel and components; rustup installs it on first use.
      - name: Toolchain
        run: rustup show active-toolchain

      - name: Native build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libxcb1-dev libfontconfig-dev libfreetype-dev libvulkan-dev libasound2-dev

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # The checks AGENTS.md lists, in its order: fmt, the five xtask checks, both clippy runs,
      # nextest and the doc tests. The ci profile is in .config/nextest.toml.
      - name: Gates
        run: cargo xtask gates
        env:
          NEXTEST_PROFILE: ci
