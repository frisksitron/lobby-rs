name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The Release runs it too, and publishes only once it passes.
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  # .config/nextest.toml: everything but the GPU tests, and every failure reported.
  NEXTEST_PROFILE: ci

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      # The tags, for check-commits: it reads the subjects since the last one.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # rust-toolchain.toml pins the channel and components; rustup installs it on first use.
      - name: Toolchain
        run: rustup show active-toolchain

      # lobby-client builds at the workspace's opt-level 3, as on a developer's machine: the
      # DPDFNet test in media::dsp takes over 30 s at opt-level 0 (the nextest timeout) and under
      # a second at 3.
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main's runs refresh the cache, so a pull request or a Release does not wait
          # minutes to save one.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # The checks AGENTS.md lists, in its order: fmt, the six xtask checks, both clippy runs,
      # nextest and the doc tests.
      - name: Gates
        run: cargo xtask gates

  # The desktop app ships for Windows and Linux, and the server as a Linux image: the whole
  # workspace is checked on both. The gates include the server's own clippy run, as the image
  # builds it, and its tests, so this job replaces the server-only one that stood here.
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # What the build links. The same list as release.yml's Linux job: change both together.
      # The tests need no display, D-Bus, Secret Service or sound server: the runner has none.
      - name: Packages
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          cmake pkg-config libasound2-dev libfontconfig-dev libfreetype-dev
          libxcb1-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev

      - name: Gates
        run: cargo xtask gates
