# A `v<version>` tag, pushed by `cargo xtask release <version>`, becomes a GitHub Release with the
# Windows and Linux apps, which every installed Lobby updates to, and a server image on ghcr.io.
# CI, the apps, their notices and the image build side by side; nothing is published unless CI
# passes, its Linux job included. The Linux app's own build is the one job that does not hold the
# Release back: if it fails, the Release goes out with the Windows app alone, and re-running the
# failed jobs adds the Linux files to it.
name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  app:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml pins the channel and components; rustup installs it on first use.
      - name: Toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: The tag names the workspace version
        shell: bash
        run: |
          version=$(sed -n '/^\[workspace.package\]/{n;s/^version = "\(.*\)"/\1/p}' Cargo.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but Cargo.toml says $version"
            exit 1
          fi

      # The app learns its repository here: it installs itself and reads this repository's
      # Releases for updates.
      - name: Build LobbySetup.exe and latest.json
        run: cargo xtask dist --repo ${{ github.repository }}

      - uses: actions/upload-artifact@v7
        with:
          name: app
          path: dist/

  linux-app:
    name: Linux app
    # The oldest system the app is promised to start on: xtask's glibc ceiling is this runner's,
    # and `dist` fails a build that needs more.
    runs-on: ubuntu-24.04
    # `publish` waits for this job: one that hangs must not hold the Windows release for hours.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml pins the channel and components; rustup installs it on first use.
      - name: Toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      # What the build links: cmake for Opus, and the development files of ALSA, fontconfig,
      # FreeType, xcb and xkbcommon. Vulkan and Wayland are loaded when the app runs.
      - name: Packages
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          cmake pkg-config libasound2-dev libfontconfig-dev libfreetype-dev
          libxcb1-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev

      - name: The tag names the workspace version
        run: |
          version=$(sed -n '/^\[workspace.package\]/{n;s/^version = "\(.*\)"/\1/p}' Cargo.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but Cargo.toml says $version"
            exit 1
          fi

      # The app learns its repository here, as the Windows one does.
      - name: Build lobby-linux-x86_64 and latest-linux.json
        run: cargo xtask dist --repo ${{ github.repository }}

      - name: The installer
        run: cp packaging/linux/install.sh dist/install.sh

      - uses: actions/upload-artifact@v7
        with:
          name: linux-app
          path: dist/

  notices:
    name: Third-party notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      # The licence of every crate in the Windows and Linux apps (about.toml names the targets); a
      # licence not accepted there fails here.
      - name: Generate
        working-directory: packaging/notices
        run: >
          cargo about generate -m ../../crates/lobby-desktop/Cargo.toml about.hbs
          -o THIRD-PARTY-NOTICES.html

      - uses: actions/upload-artifact@v7
        with:
          name: notices
          path: packaging/notices/THIRD-PARTY-NOTICES.html

  # A job whose `needs` did not all succeed is skipped, unless its `if` has a status function.
  # `!cancelled()` is one: with it the condition below decides alone, and it still holds back a
  # cancelled run. `linux-app` is listed in `needs` for its artifact and is left out of the
  # condition, so a failed or skipped Linux build does not stop the Windows release.
  publish:
    name: Publish the Release
    needs: [ci, app, linux-app, notices]
    if: >-
      ${{ !cancelled()
      && needs.ci.result == 'success'
      && needs.app.result == 'success'
      && needs.notices.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # gh uploads the files before it publishes, so no app sees a Release without its files.
      # install.sh is what a person on Linux downloads to install: its link stays the same.
      # The Linux files go up only when the Linux job left them: an artifact exists only after
      # that job's last step. A Release that is already out is one that went without them: a
      # re-run of the failed Linux job ends here again, and adds them.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          LINUX_RESULT: ${{ needs.linux-app.result }}
        run: |
          linux=()
          if [ -f dist/lobby-linux-x86_64 ] && [ -f dist/latest-linux.json ] && [ -f dist/install.sh ]; then
            linux=(dist/lobby-linux-x86_64 dist/latest-linux.json dist/install.sh)
          fi
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ ${#linux[@]} -eq 0 ]; then
              echo "::error::The Release is out without the Linux app, and the Linux job left none (the Linux job: $LINUX_RESULT)"
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" "${linux[@]}" --clobber
            exit 0
          fi
          if [ ${#linux[@]} -eq 0 ]; then
            echo "::warning::The Linux app was not built (the Linux job: $LINUX_RESULT): publishing the Release without it"
          fi
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
            dist/LobbySetup.exe dist/latest.json dist/THIRD-PARTY-NOTICES.html "${linux[@]}" \
            --title "Lobby ${GITHUB_REF_NAME#v}" --notes-file dist/release-notes.md --verify-tag

  image:
    name: Server image
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.image.outputs.name }}
      version: ${{ steps.image.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Image name and version
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lobby-server" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      # Built into the cache only; `push-image` sends it once CI has passed.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max

  push-image:
    name: Push the server image
    needs: [ci, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The same build as `image`, so every layer comes from the cache.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ${{ needs.image.outputs.name }}:${{ needs.image.outputs.version }}
            ${{ needs.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.image.outputs.version }}
          cache-from: type=gha
