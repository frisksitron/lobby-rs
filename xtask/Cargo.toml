[package]
name = "xtask"
description = "Repository gates and tools, never shipped."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# `drive` seeds the scratch server's Members and reads its Magic Codes through
# `lobby_server::testing`, whose mail sink runs on Tokio.
lobby-server = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
# `dist` writes the SHA-256 the app checks its update against.
sha2.workspace = true
tokio.workspace = true

# `drive` on Linux removes a driven client's saved sessions from the Secret Service, as the
# client's own keychain crate names them.
[target.'cfg(target_os = "linux")'.dependencies]
keyring.workspace = true

[lints]
workspace = true
